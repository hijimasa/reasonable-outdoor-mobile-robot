; Bench sketch: drives one motor at a time in open loop and prints what comes
; back, to settle which way a positive duty turns a wheel and which sign the
; feedback uses. Not a robot firmware -- there is no host link and no closed
; loop. Flash DDTMotorController again afterwards.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = seeed-studio/CAN_BUS_Shield@^2.3.3
